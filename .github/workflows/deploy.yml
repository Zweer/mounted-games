name: Deploy (Cloudflare)

# Fires when a GitHub Release is published — i.e. when the Release Please PR is
# merged and a vX.Y.Z tag is cut. The checkout resolves to that release's tag,
# so it deploys exactly the released commit, not whatever HEAD of main is now.
#
# No test gate here: `main` is protected and CI (ci.yml) is a required check on
# every PR, so the released commit is already verified. Re-testing an identical
# tree would only add latency.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit, D1:Edit, Workers KV:Edit
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Worker RUNTIME secrets (CRON_SECRET, BETTER_AUTH_SECRET, *_BASE_URL) stay as
# `wrangler secret put ...` on the account — they are NOT set here.

on:
  release:
    types: [published]
  # Manual re-deploy of the current default branch, e.g. after rotating a
  # runtime secret.
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `npm run deploy` = opennextjs-cloudflare build && opennextjs-cloudflare deploy.
      # The OpenNext build needs @swc/core (allowScripts already permits it).
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
