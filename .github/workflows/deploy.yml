name: Deploy (Cloudflare)

# Single source of truth for the Cloudflare deploy. Invoked two ways, same steps:
#   - automatically: called by release-please.yml (`uses:`) when a release is cut
#     (a release made with the default GITHUB_TOKEN can't trigger an `on: release`
#     workflow, so release-please calls this one directly);
#   - manually: `workflow_dispatch` from the Actions tab, for an out-of-release
#     redeploy (e.g. after rotating a runtime secret).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit, D1:Edit, Workers KV:Edit
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Worker RUNTIME secrets (CRON_SECRET, BETTER_AUTH_SECRET, *_BASE_URL) stay as
# `wrangler secret put ...` — NOT set here.

on:
  # Called by release-please.yml; the caller passes the tag to deploy and the
  # secrets via `secrets: inherit`.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to check out and deploy.
        type: string
        required: false
  # Manual redeploy of the default branch from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # When called with a tag, deploy exactly that released commit; on a
          # manual dispatch `inputs.ref` is empty → checkout the default branch.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `npm run deploy` = opennextjs-cloudflare build && opennextjs-cloudflare deploy.
      # The OpenNext build needs @swc/core (allowScripts already permits it).
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
