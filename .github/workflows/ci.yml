name: CI

# Verification gate for pull requests. With `main` protected and this workflow
# set as a required status check, a PR cannot merge unless lint, typecheck and
# tests pass. It does NOT run on push to main: code reaching main is already
# green (it got there only via a passing PR), so re-running here would be wasted
# work. Deployment lives in deploy.yml and fires on a published release.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test
