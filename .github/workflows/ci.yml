name: CI

# Verification gate for pull requests. With `main` protected and this workflow
# set as a required status check, a PR cannot merge unless lint, typecheck and
# tests pass. It does NOT run on push to main: code reaching main is already
# green (it got there only via a passing PR), so re-running here would be wasted
# work. Deployment lives in deploy.yml and fires on a published release.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      # Validate every commit in the PR with the same commitlint.config.js that
      # the local lefthook commit-msg hook uses — a non-bypassable CI equivalent
      # (web-UI commits and contributors without hooks go through here too).
      # With merge commits, Release Please reads these individual commits to
      # build the version bump + changelog, so each must be conventional.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the base..head commit range is available.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
